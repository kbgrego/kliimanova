
<div class="login-page">

  <div class="login-card">

    <img href="/home" class="brand-logo" src="../logo.png" alt="Kliimanova logo" />

    <h1>Admin Console</h1>

    <p class="subtitle">
      Sign in to manage your HVAC services
    </p>

    <button class="google-btn" type="button" (click)="loginWithGoogle()">
      <span class="google-icon">
        G
      </span>

      <span>Continue with Google</span>
    </button>

    <div class="divider">
      <span>Authorized personnel only</span>
    </div>

    <p class="footer-text">
      Access to this area is restricted to authorized administrators.
    </p>

  </div>

</div>
