<section class="page-shell">
  <div class="overlay"></div>

  <nav class="site-navigation"
      [class.open]="isNavigationOpen()"
      aria-label="Primary navigation">

    <button
        class="navigation-toggle"
        type="button"
        [attr.aria-expanded]="isNavigationOpen()"
        (click)="toggleNavigation()">
        <span class="hamburger">
            <i></i><i></i><i></i>
        </span>
    </button>

    <div class="navigation-links" id="primary-navigation-links">
        <a #navItem
          routerLink="/home"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact:true}"
          (click)="closeNavigation()">
            {{ t('nav.home') }}
        </a>
        <a #navItem
          routerLink="/cooling"
          routerLinkActive="active"
          (click)="closeNavigation()">
            {{ t('nav.cooling') }}
        </a>
        <a #navItem
          routerLink="/heating"
          routerLinkActive="active"
          (click)="closeNavigation()">
            {{ t('nav.heating') }}
        </a>
        <a #navItem
          routerLink="/heating-pumps"
          routerLinkActive="active"
          (click)="closeNavigation()">
            {{ t('nav.heating-pumps') }}
        </a>
        <a #navItem
          routerLink="/request"
          routerLinkActive="active"
          (click)="closeNavigation()">
            {{ t('nav.consultation') }}
        </a>

        <!-- animated underline -->
        <span #navIndicator class="nav-indicator"></span>
    </div>
  </nav>

  <app-language-selec></app-language-selec>

  <app-brand-logo></app-brand-logo>

  <div class="hero-navi">{{ pageName }}</div>

  <main class="route-content">
    <router-outlet />
  </main>

  <app-toolbar-bottom></app-toolbar-bottom>
</section>
